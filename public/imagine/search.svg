<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <style>
    path { fill: none; stroke: #2b2a33; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
    @keyframes draw { from { visibility: visible; } to { visibility: visible; stroke-dashoffset: 0; } }
  </style>
  <filter id="boil" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="1" result="noise">
      <animate attributeName="seed" values="1;2;3;4;5;6" dur="0.86s" repeatCount="indefinite" calcMode="discrete"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#boil)">
    <rect width="48" height="48" fill="none"/>
    <path pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;visibility:hidden;animation:draw 0.51s cubic-bezier(.65,.05,.36,1) 0.00s forwards" d="M 21 9.6 C 27.6 9.4, 31.8 13.8, 31.6 20.3 C 31.4 26.6, 27 30.6, 20.8 30.4 C 14.7 30.2, 10.6 26, 10.6 19.9 C 10.6 13.9, 14.9 9.8, 21 9.6 Z"/>
    <path pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;visibility:hidden;animation:draw 0.15s cubic-bezier(.65,.05,.36,1) 0.36s forwards" d="M 28.9 28.4 C 31.9 31.4, 34.9 34.5, 37.8 37.7"/>
  </g>
</svg>
