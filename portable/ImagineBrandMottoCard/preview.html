<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imagine Brand Motto Card</title>
  <link rel="stylesheet" href="./ImagineBrandMottoCard.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f1ef; }
    .preview-sidebar { position: relative; width: 224px; height: 720px; background: #fdfcfc; border-radius: 18px; box-shadow: 0 16px 50px rgba(35, 30, 27, .08); }
  </style>
</head>
<body>
  <aside class="preview-sidebar">
    <section class="imagine-brand-motto-card" aria-label="Imagine Lab 品牌宣言">
      <p class="imagine-brand-motto-card__copy">让想象力，<br />成为团队的生产力。</p>
      <span class="imagine-brand-motto-card__brand">
        <img src="./assets/imagine-lab-logo.png" alt="Imagine Lab" />
        <b>Imagine Lab</b>
      </span>
    </section>
  </aside>
</body>
</html>
